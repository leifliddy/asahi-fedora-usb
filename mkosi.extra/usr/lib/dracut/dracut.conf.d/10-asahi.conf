# Modules necessary for using Linux on Apple Silicon Macs

# For NVMe & SMC
add_drivers+=" apple-mailbox "

# For NVMe
add_drivers+=" nvme_apple "

# For USB and HID
add_drivers+=" pinctrl-apple-gpio "

# SMC core
add_drivers+=" macsmc "

# For USB & Thunderbolt
add_drivers+=" i2c-pasemi-platform tps6598x apple-dart dwc3 dwc3-of-simple xhci-pci pcie-apple gpio_macsmc thunderbolt_apple "

# For HID
add_drivers+=" spi-apple spi-hid-apple spi-hid-apple-of "

# For RTC
add_drivers+=" rtc-macsmc spmi-apple-controller "

# For MTP HID
add_drivers+=" apple-dockchannel dockchannel-hid apple-rtkit-helper "

# For Apple firmware
add_dracutmodules+=" asahi-firmware "
